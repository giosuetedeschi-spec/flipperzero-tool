[package]
name = "flipperzero-tool"
version = "0.1.0"
description = "Flipper Zero File Manager & Reverse Engineering Tool"
authors = ["giosue"]
edition = "2024"

[lib]
name = "flipperzero_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
env_logger = "0.11"
dirs = "5"
open = "5"
lazy_static = "1"

# `serialport` binds host USB stacks (libudev on Linux, IOKit on macOS, Win32)
# and cannot build for iOS or Android. Mobile talks to the Flipper over BLE and
# Android USB-OTG instead, so the crate is desktop-only and every call site of
# it lives behind `#[cfg(desktop)]`.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
serialport = "4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
