name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend (tauri::generate_context! needs frontend/dist to exist)
        run: npm ci && npm run build
        working-directory: frontend
      - name: Check formatting
        run: cargo fmt -- --check
        working-directory: src-tauri
      - name: Clippy
        run: cargo clippy -- -D warnings
        working-directory: src-tauri

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend (tauri::generate_context! needs frontend/dist to exist)
        run: npm ci && npm run build
        working-directory: frontend
      - name: Run tests
        run: cargo test
        working-directory: src-tauri

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # `tsc --noEmit` checks nothing here: the root tsconfig.json has
      # "files": [] and only project references, so it silently passed while
      # real type errors sat in the app sources. `tsc -b` builds the referenced
      # projects and actually checks them.
      - name: Type check
        run: npx tsc -b --force
        working-directory: frontend

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: ESLint
        run: npx eslint src/
        working-directory: frontend

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Run tests
        run: npm test
        working-directory: frontend

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies (RUSTSEC advisories)
        run: cargo audit
        working-directory: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Audit npm dependencies (high/critical only)
        run: npm audit --audit-level=high
        working-directory: frontend

  # Type-checks the crate for Android. This is the guard that keeps the mobile
  # port buildable: it fails the moment a desktop-only dependency (serialport)
  # or an un-gated call site leaks back into the shared code path. It also
  # exercises rusqlite's bundled SQLite against the NDK toolchain, which is the
  # part of the dependency tree most likely to break on a cross build.
  #
  # A local machine cannot stand in for this job unless it has the NDK, so the
  # check lives here rather than in a developer script.
  android-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend (tauri::generate_context! needs frontend/dist to exist)
        run: npm ci && npm run build
        working-directory: frontend
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      # cargo-ndk locates the toolchain from ANDROID_NDK_ROOT, which the runner
      # image already exports. Setting ANDROID_NDK_HOME here would override it
      # with an empty string, since that variable is not in the `env` context.
      - name: Check Android build (arm64)
        run: cargo ndk -t arm64-v8a check
        working-directory: src-tauri
      - name: Assert serialport is excluded from the Android dependency tree
        run: |
          if cargo tree --target aarch64-linux-android -i serialport 2>/dev/null | grep -q '^serialport'; then
            echo "::error::serialport resolved for Android; it is desktop-only and must stay behind cfg(desktop)"
            exit 1
          fi
          echo "serialport correctly absent from the Android dependency tree"
        working-directory: src-tauri

  # Type-checks the crate for iOS. This environment cannot do it at all -- iOS
  # needs macOS and Xcode -- so without this job nothing verifies that the
  # shared code compiles for the one platform where BLE is the only transport.
  #
  # A check rather than a build: producing an .ipa needs signing identities that
  # do not belong in CI for a sideloaded app. Compiling is what catches a
  # desktop-only dependency leaking back into the shared path.
  ios-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ios
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend (tauri::generate_context! needs frontend/dist to exist)
        run: npm ci && npm run build
        working-directory: frontend
      - name: Check iOS build (arm64)
        run: cargo check --target aarch64-apple-ios
        working-directory: src-tauri
      - name: Assert serialport is excluded from the iOS dependency tree
        run: |
          if cargo tree --target aarch64-apple-ios -i serialport 2>/dev/null | grep -q '^serialport'; then
            echo "::error::serialport resolved for iOS; it is desktop-only and must stay behind cfg(desktop)"
            exit 1
          fi
          echo "serialport correctly absent from the iOS dependency tree"
        working-directory: src-tauri
